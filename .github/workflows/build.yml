# Builds Ronin for Windows and Android with ONE version (the VERSION file),
# runs every test (also on an Android emulator), and on a "v*" tag publishes one
# GitHub release that both apps update from.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this VERSION as a release (Windows + Android update)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright for the UI tests
        run: |
          npm install -g playwright@1
          npx playwright install --with-deps chromium
      - name: Build + all tests (build.sh)
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: ./build.sh "$(cat VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/Ronin.exe
            build/RoninSetup.exe
            build/SHA256SUMS.txt

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          RONIN_KEYS_PASS: ${{ secrets.RONIN_KEYS_PASS }}
        run: |
          if [ -n "$RONIN_KEYS_PASS" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            printf '%s' "$RONIN_KEYS_PASS" > "$RUNNER_TEMP/keys/pass"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keys/ronin-keys.tar.enc -pass "file:$RUNNER_TEMP/keys/pass" | tar -xf - -C "$RUNNER_TEMP/keys"
            echo "RONIN_KEYSTORE=$RUNNER_TEMP/keys/ronin-android.p12" >> "$GITHUB_ENV"
            echo "::add-mask::$RONIN_KEYS_PASS"
            echo "RONIN_KEYSTORE_PASS=$RONIN_KEYS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::RONIN_KEYS_PASS is not set - the APK is not signed for release"
          fi
      - name: Unit tests + APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Test summary
        if: always()
        run: |
          python3 - android/app/build/test-results >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob(sys.argv[1] + "/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  bad = tc.find("failure") is not None or tc.find("error") is not None
                  rows.append(("FAIL" if bad else "PASS", tc.get("classname", "").split(".")[-1] + "." + tc.get("name", "")))
          print(f"### {sys.argv[1]}: {sum(r[0]=='PASS' for r in rows)} passed, {sum(r[0]=='FAIL' for r in rows)} failed")
          for r in sorted(set(rows)):
              print(f"- {r[0]} {r[1]}")
          PY
      - name: Name the APK
        run: |
          mkdir -p out
          f=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" out/Ronin.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/Ronin.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/

  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests on an emulator (${{ matrix.device }} - phone Android 15, tablet Android 16)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.device == 'tablet' && 36 || 35 }}
          profile: ${{ matrix.device == 'tablet' && 'pixel_tablet' || 'pixel_6' }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            timeout 30m ./gradlew --no-daemon connectedDebugAndroidTest || echo failed > ../device-tests-failed
            timeout 120 adb pull /data/local/tmp/qa ../qa || true
            timeout 60 adb logcat -d -b crash > ../crash.txt || true
      - name: Screenshots for checking (release "qa")
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls qa 2>/dev/null || exit 0
          gh release view qa >/dev/null 2>&1 || gh release create qa --title "QA screenshots" --notes "Emulator screenshots from the last build (not a Ronin release)." --prerelease || true
          sleep 3
          for f in qa/*.png; do cp "$f" "${{ matrix.device }}-$(basename "$f")"; gh release upload qa "${{ matrix.device }}-$(basename "$f")" --clobber; done
      - name: Fail if a device test failed
        run: test ! -f device-tests-failed
      - name: Test summary
        if: always()
        run: |
          echo "## ${{ matrix.device }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s crash.txt ]; then echo "### App crashes"; echo '```'; head -80 crash.txt; echo '```'; fi >> "$GITHUB_STEP_SUMMARY"
          if [ -s crash.txt ]; then echo "---- crash log ----"; head -120 crash.txt; fi
          python3 - android/app/build/outputs/androidTest-results >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob(sys.argv[1] + "/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  bad = tc.find("failure") is not None or tc.find("error") is not None
                  rows.append(("FAIL" if bad else "PASS", tc.get("classname", "").split(".")[-1] + "." + tc.get("name", "")))
          print(f"### {sys.argv[1]}: {sum(r[0]=='PASS' for r in rows)} passed, {sum(r[0]=='FAIL' for r in rows)} failed")
          for r in sorted(set(rows)):
              print(f"- {r[0]} {r[1]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-report-${{ matrix.device }}
          path: android/app/build/reports/androidTests/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [windows, android, android-device]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Sign and publish
        env:
          RONIN_KEYS_PASS: ${{ secrets.RONIN_KEYS_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="$(cat VERSION)"
          case "$GITHUB_REF" in refs/tags/*) [ "refs/tags/v$V" = "$GITHUB_REF" ] || { echo "tag does not match VERSION $V"; exit 1; } ;; esac
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V is already published - change VERSION first"; exit 1; fi
          [ -n "$RONIN_KEYS_PASS" ] || { echo "RONIN_KEYS_PASS secret missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys" rel
          printf '%s' "$RONIN_KEYS_PASS" > "$RUNNER_TEMP/keys/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keys/ronin-keys.tar.enc -pass "file:$RUNNER_TEMP/keys/pass" | tar -xf - -C "$RUNNER_TEMP/keys"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V"
          cp dl/windows/Ronin.exe dl/windows/RoninSetup.exe dl/android/Ronin.apk rel/
          go run ./tools/release -version "$V" -exe rel/Ronin.exe -base "$BASE" -key "$RUNNER_TEMP/keys/ronin-release-private.key" -out rel
          CODE=$(echo "$V" | awk -F. '{print $1*10000+$2*100+$3}')
          SHA=$(sha256sum rel/Ronin.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s rel/Ronin.apk)
          printf '{"versionCode":%s,"versionName":"%s","url":"%s/Ronin.apk","sha256":"%s","size":%s}\n' "$CODE" "$V" "$BASE" "$SHA" "$SIZE" > rel/android.json
          (cd rel && sha256sum * > SHA256SUMS.txt)
          rm -rf "$RUNNER_TEMP/keys"
          gh release create "v$V" rel/* --target "$GITHUB_SHA" --latest --title "Ronin $V" --notes "Ronin Browser $V for Windows and Android. Windows: RoninSetup.exe (or automatic update). Android phone / tablet: Ronin.apk (or Menu > Check for updates)."
