# Ronin Agent pilot (Claude works inside the owner's own Ronin). A SEPARATE app "Ronin Agent Lab"
# (com.ronin.agentlab), so tests on his real phone / tablet never touch Ronin Browser. Nothing here publishes Ronin.
name: agent-pilot

on:
  workflow_dispatch:
  push:
    branches: ["claude/agent-*"]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Rules unit tests + lab app + its device tests
        working-directory: android
        run: ./gradlew --no-daemon testLabDebugUnitTest --tests 'com.ronin.browser.agent.*' assembleLabDebug assembleLabDebugAndroidTest
      - name: Test summary
        if: always()
        run: |
          python3 - android/app/build/test-results >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob(sys.argv[1] + "/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  bad = tc.find("failure") is not None or tc.find("error") is not None
                  msg = (tc.find("failure") if tc.find("failure") is not None else tc.find("error"))
                  rows.append(("FAIL" if bad else "PASS", tc.get("classname", "").split(".")[-1] + "." + tc.get("name", "") + ((" - " + (msg.get("message") or "")[:200]) if bad else "")))
          print(f"### unit: {sum(r[0]=='PASS' for r in rows)} passed, {sum(r[0]=='FAIL' for r in rows)} failed")
          for r in sorted(set(rows)):
              print(f"- {r[0]} {r[1]}")
          PY
      - name: Lab APKs (release "agent-lab", a test build only, never an update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/lab/debug/*.apk RoninAgentLab.apk
          cp android/app/build/outputs/apk/androidTest/lab/debug/*.apk RoninAgentLab-test.apk
          gh release view agent-lab >/dev/null 2>&1 || gh release create agent-lab --title "Ronin Agent Lab (pilot test build)" --notes "Pilot test app (com.ronin.agentlab). Not a Ronin release, never offered as an update." --prerelease || true
          for A in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$A go build -trimpath -ldflags "-s -w" -o roninrelay-linux-$A ./cmd/roninrelay; sha256sum roninrelay-linux-$A | cut -d' ' -f1 > roninrelay-linux-$A.sha256; done
          go test ./internal/agentrelay ./internal/agentcore
          gh release upload agent-lab RoninAgentLab.apk RoninAgentLab-test.apk roninrelay-linux-amd64 roninrelay-linux-amd64.sha256 roninrelay-linux-arm64 roninrelay-linux-arm64.sha256 --clobber

  # the laptop agent: built and run for real on Windows (WebView2), on made-up pages, before anything ships
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Ronin Agent Lab (laptop)
        shell: pwsh
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o lab\RoninAgentLab.exe ./cmd/roninagent
      - name: Self-test in a real window
        shell: pwsh
        run: |
          $p = Start-Process -FilePath lab\RoninAgentLab.exe -ArgumentList "-selftest" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); "FAIL timeout" | Out-File lab\data\selftest.txt -Append }
          Get-Content lab\data\selftest.txt -ErrorAction SilentlyContinue
          Get-Content lab\data\agent-log.txt -ErrorAction SilentlyContinue | Select-Object -Last 60
          "## laptop self-test" >> $env:GITHUB_STEP_SUMMARY
          Get-Content lab\data\selftest.txt -ErrorAction SilentlyContinue | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
          if (-not (Select-String -Path lab\data\selftest.txt -Pattern "TOTAL \d+ passed, 0 failed" -Quiet)) { exit 1 }
      - name: Upload (release "agent-lab", test build only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (Get-FileHash lab\RoninAgentLab.exe -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii lab\RoninAgentLab.exe.sha256
          gh release upload agent-lab lab\RoninAgentLab.exe lab\RoninAgentLab.exe.sha256 --clobber

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Agent device tests (${{ matrix.device }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.device == 'tablet' && 36 || 35 }}
          profile: ${{ matrix.device == 'tablet' && 'pixel_tablet' || 'pixel_6' }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            timeout 25m ./gradlew --no-daemon connectedLabDebugAndroidTest || echo failed > ../agent-tests-failed
            sh ../tools/agentsim/ci-e2e.sh || echo failed > ../agent-tests-failed
            timeout 60 adb logcat -d -s RoninAgent > ../agent-log.txt || true
            grep -E 'TEST|MECH|blocked|refused|owner' ../agent-log.txt | tail -250 || true
            timeout 60 adb logcat -d -b crash > ../crash.txt || true
      - name: Test summary
        if: always()
        run: |
          echo "## ${{ matrix.device }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s agent-log.txt ]; then echo "### mechanisms"; echo '```'; grep -E "MECH|blocked" agent-log.txt | tail -60; echo '```'; fi >> "$GITHUB_STEP_SUMMARY"
          if [ -s crash.txt ]; then echo "### crashes"; echo '```'; head -60 crash.txt; echo '```'; fi >> "$GITHUB_STEP_SUMMARY"
          python3 - android/app/build/outputs/androidTest-results >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob(sys.argv[1] + "/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  bad = tc.find("failure") is not None or tc.find("error") is not None
                  msg = (tc.find("failure") if tc.find("failure") is not None else tc.find("error"))
                  rows.append(("FAIL" if bad else "PASS", tc.get("name", "") + ((" - " + (msg.text or "")[:300].replace("\n", " ")) if bad else "")))
          print(f"### device: {sum(r[0]=='PASS' for r in rows)} passed, {sum(r[0]=='FAIL' for r in rows)} failed")
          for r in sorted(set(rows)):
              print(f"- {r[0]} {r[1]}")
          PY
          python3 - android/app/build/outputs/androidTest-results <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          for f in glob.glob(sys.argv[1] + "/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for k in ("failure", "error"):
                      e = tc.find(k)
                      if e is not None: print("FAILED", tc.get("name"), "::", (e.text or "")[:700].replace("\n", " | "))
          PY
      - name: Fail if a test failed
        run: test ! -f agent-tests-failed
