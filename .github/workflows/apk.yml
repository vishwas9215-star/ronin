name: Ronin Teachers APK
on:
  push:
    branches: [ronin-teachers-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: APK को ronin-teachers-apk-out branch में रखें
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b ronin-teachers-apk-out
          git config user.name "apk-bot" && git config user.email "apk-bot@users.noreply.github.com"
          git add . && git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ronin-teachers-apk-out
