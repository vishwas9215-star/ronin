<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF / Photo tools</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#111;--mut:#555;--line:#d6dbe6;--acc:#2563eb;--ok:#16a34a;--bad:#b91c1c}
body.dark{--bg:#15171c;--card:#20232b;--fg:#eee;--mut:#aab;--line:#343846}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI","Nirmala UI","Noto Sans Devanagari",sans-serif;font-size:17px}
main{max-width:1100px;margin:0 auto;padding:12px 14px 60px}h1{font-size:21px;margin:4px 0}h2{font-size:15px;margin:14px 0 6px;color:var(--mut)}
p.sub{color:var(--mut);margin:4px 0 10px;line-height:1.4;font-size:14.5px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px;align-items:start}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 6px}.cat h2{font-size:14px;margin:0 0 4px 6px;color:var(--mut)}
.list{display:flex;flex-direction:column}
.tool{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);font-family:inherit;text-align:left;padding:6px;border-radius:9px;cursor:pointer;min-height:44px}
.tool:hover,.tool:focus{background:var(--bg)}.tool .ic{font-size:19px;width:26px;text-align:center;flex:none}.tool b{display:block;font-size:15px;font-weight:600}
.tool small{display:block;color:var(--mut);font-size:12.5px;line-height:1.3}
.res{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:12px 14px;margin:12px 0;line-height:1.6;white-space:pre-line}
.res.ok{border-left-color:var(--ok)}.res.bad{border-left-color:var(--bad)}.res.warn{border-left-color:#f59e0b}.res ul{margin:6px 0 4px 18px;padding:0}.res big{display:block;font-size:22px;font-weight:700;white-space:normal}
select{font:inherit;font-size:17px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:520px;width:100%}
input[type=date]{font:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.big{display:block;width:100%;max-width:640px;min-height:52px;margin:10px 0;border:0;border-radius:16px;font-family:inherit;font-size:19px;font-weight:600;cursor:pointer;color:#fff;background:var(--acc)}
.big.go{background:var(--ok)}.two{display:flex;gap:10px;max-width:640px}.two .big{flex:1}.big.cam{background:#7c3aed}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}.ed-wrap{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);background:#fff;touch-action:none}
.ed-wrap canvas{display:block;max-width:100%}textarea{font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;max-width:640px;min-height:70px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;max-width:640px}
.crop{position:relative;display:inline-block;max-width:100%;touch-action:none}.crop canvas{display:block;max-width:100%}.big:disabled{opacity:.45;cursor:default}
.back{border:0;background:none;color:var(--acc);font:inherit;font-size:17px;cursor:pointer;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:22px;padding:10px 16px;font-family:inherit;font-size:16px;cursor:pointer;min-height:44px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
ul.files{list-style:none;padding:0;margin:6px 0}ul.files li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:8px;align-items:center}
ul.files li b{flex:1;word-break:break-all;font-weight:600;font-size:15.5px}ul.files li button{min-width:44px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
#msg{background:var(--card);border-left:5px solid var(--ok);border-radius:10px;padding:12px 14px;display:none;white-space:pre-line;margin:10px 0}#msg.err{border-color:var(--bad)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.th{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;position:relative}
.th canvas{max-width:100%;background:#fff;display:block;margin:0 auto}.th.off{opacity:.35;border-color:var(--bad)}.th .n{font-size:14px;margin:4px 0}
.th .row{display:flex;gap:4px;justify-content:center}.th .row button{flex:1;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:16px;cursor:pointer}
.place{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);background:#fff;touch-action:none}
.place canvas{display:block;max-width:100%}
#pad{background:#fff;border:2px dashed var(--line);border-radius:12px;touch-action:none;width:100%;max-width:520px;height:200px;display:block}
input[type=range]{width:100%;max-width:520px}input[type=text],input[type=password],input[type=number]{font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;max-width:520px}
label.opt{display:block;margin:10px 0 2px;font-weight:600}
.signprev{max-height:70px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;vertical-align:middle}
.note{color:var(--mut);font-size:14.5px}
</style></head><body>
<main id="app"></main>
<input id="pick" type="file" hidden>
<script src="lib/pdf-lib.min.js"></script>
<script src="merge.js"></script>
<script src="datecalc.js"></script>
<script src="rules.js"></script>
<script src="scamcheck.js"></script>
<script type="module" src="tools.js"></script>
</body></html>
