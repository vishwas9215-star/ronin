<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ronin Messages</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--fg:#f1f3f7;--mut:#a3acbd;--line:#2c3342;--acc:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Devanagari","Nirmala UI","Segoe UI",sans-serif;font-size:17px}
main{max-width:900px;margin:0 auto;padding:0 12px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;min-height:64px;z-index:7}
.top h1{font-size:21px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}.top>div{display:flex;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:48px;min-width:48px;padding:0 14px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.pill.red{background:var(--bad);border-color:var(--bad);color:#fff}.pill.blue{background:var(--acc);border-color:var(--acc);color:#fff}.pill.green{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.tabs button{flex:none}.tabs .on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;line-height:1.5}
.card h2{font-size:17px;margin:0 0 6px}.card ol{margin:6px 0 6px 20px;padding:0}
.th{display:flex;gap:14px;align-items:center;min-height:78px;padding:10px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.th.scam{background:#2a1215;border-left:4px solid var(--bad);border-radius:10px;margin:4px 0;border-bottom:0}
.th.unread b{font-weight:800}.th:not(.unread) b{font-weight:600}
.av{flex:none;width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;background:#334155}
.th .mid{flex:1;min-width:0}.th b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px}.th small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px;margin-top:3px}
.th .tm{flex:none;color:var(--mut);font-size:13px;text-align:right}.dot{display:inline-block;min-width:22px;padding:1px 6px;border-radius:11px;background:var(--acc);color:#fff;font-size:13px;margin-top:4px}
.tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:700;margin-left:6px}.tag.scam{background:var(--bad);color:#fff}.tag.ads{background:#475569;color:#fff}.tag.unknown{background:#7c5d12;color:#fff}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.b{max-width:85%;padding:9px 12px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.b.in{align-self:flex-start;background:var(--card);border:1px solid var(--line)}.b.out{align-self:flex-end;background:#1e3a8a}
.b small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.warn{background:#3b1414;border:2px solid var(--bad);border-radius:12px;padding:8px 10px;margin:6px 0 2px;font-size:15px}.warn.amber{background:#3a2a0a;border-color:var(--warn)}
.compose{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-height:48px;max-height:140px;font:inherit;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);resize:none}
input.txt{display:block;width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin:6px 0}
.note{color:var(--mut);font-size:14px;line-height:1.45}.empty{color:var(--mut);text-align:center;padding:40px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
/* the four boxes: a strip at the TOP, under the title (owner's choice, Nov 2026) */
.nav{position:sticky;top:64px;z-index:6;display:flex;gap:6px;padding:6px 0 10px;background:var(--bg)}
.nav button{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--mut);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.nav button .ic{font-size:19px;line-height:1}.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}.nav button[data-tab=scam].on{background:var(--bad);border-color:var(--bad)}
.nav .n{display:inline-block;min-width:20px;margin-left:3px;padding:0 6px;border-radius:10px;background:#ef4444;color:#fff;font-size:12px}
.otpcard{display:flex;align-items:center;gap:12px;margin:4px 0 10px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#1e3a8a,#1d4ed8);border:1px solid #3b82f6}
.otpcard .code{font-size:32px;font-weight:800;letter-spacing:4px;color:#fff;line-height:1.1}.otpcard small{display:block;color:#bfdbfe;font-size:14px}.otpcard .mid{flex:1;min-width:0}
.otpcard .pill{background:#fff;color:#1d4ed8;border:0;min-height:52px}.otpcard .pill.done{background:#22c55e;color:#fff}
.otp{display:inline-flex;align-items:center;margin:2px 2px;padding:2px 12px;border-radius:12px;border:2px solid #60a5fa;background:#1e3a8a;color:#93c5fd;font:inherit;font-size:24px;font-weight:800;letter-spacing:2px;cursor:pointer}.otp span{font-size:16px;letter-spacing:0}.otp.done{border-color:#22c55e;color:#bbf7d0}
.av.brand{color:#fff;font-size:16px;letter-spacing:.5px;border:2px solid rgba(255,255,255,.25)}.top .av{width:40px;height:40px;flex:none}
.av.pic{padding:5px;overflow:hidden}.av.pic img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.star{float:right;margin:-4px -6px 0 6px;background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:4px;cursor:pointer}.star.on{color:#facc15}
.saved{margin:6px 0}.shead{display:flex;align-items:center;gap:8px;margin-bottom:4px}.shead b{flex:1;min-width:0}.shead small{color:var(--mut)}.shead .av{width:34px;height:34px;font-size:12px}
.mini{flex:none;background:none;border:0;color:var(--mut);font:inherit;font-size:13px;padding:8px 6px;cursor:pointer;text-decoration:underline}
.latest{display:inline-block;margin:4px 0 2px;padding:2px 10px;border-radius:10px;background:#16a34a;color:#fff;font-size:13px;font-weight:800}
.b.oldotp{opacity:.45}.b.oldotp .otp{border-color:#475569;background:#1f2937;color:#94a3b8;font-size:18px}
a.lnk{color:#93c5fd;text-decoration:underline;word-break:break-all}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;min-height:56px;padding:0 22px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
</style></head><body>
<main id="app"></main>
<script src="scamcheck.js"></script>
<script src="senders.js"></script>
<script src="messages.js"></script>
</body></html>
