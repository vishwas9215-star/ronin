<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://www.google.com">
<title>New Tab</title>
<style>
:root{--bg:#14171f;--card:#1c2029;--line:#2e3441;--text:#e8eaf0;--muted:#9aa3b2;--accent:#3b82f6}
body.BANKING{--bg:#0f1a14;--card:#13231a;--line:#24452f;--accent:#16a34a}
body.TRADING{--accent:#f59e0b}body.CALLS{--accent:#06b6d4}
body.PRIVATE{--bg:#16131f;--card:#1d1929;--line:#352e48;--accent:#8b5cf6}
body.light{--bg:#eef0f4;--card:#ffffff;--line:#d3d8e1;--text:#151922;--muted:#5a6375}
body.light.BANKING{--bg:#e9f5ee;--line:#b5d9c2}body.light.PRIVATE{--bg:#f1eef9;--line:#cfc5ea}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:9vh 24px 40px}
h1{font-size:30px;font-weight:650;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 26px}
form{display:flex;gap:8px;margin-bottom:34px}
input{flex:1;height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px;outline:0}
input:focus{border-color:var(--accent)}
button{height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid a{display:block;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none}
.grid a:hover{border-color:var(--accent)}
.grid a small{display:block;color:var(--muted);font-size:12px;margin-top:2px;word-break:break-all}
.note{margin-top:30px;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px}
.note b{color:var(--text)}
html:has(body.light){background:#eef0f4}html:has(body.light.BANKING){background:#e9f5ee}html:has(body.light.PRIVATE){background:#f1eef9}
</style>
</head>
<body class="{{CONTAINER}} {{THEME}}">
<main>
<h1>{{HEADING}}</h1>
<p class="sub">{{SUBTITLE}}</p>
<form action="https://www.google.com/search" method="get">
  <input name="q" placeholder="Search Google" autocomplete="off" autofocus>
  <button type="submit">Search</button>
</form>
{{SECTIONS}}
{{NOTE}}
</main>
</body>
</html>
