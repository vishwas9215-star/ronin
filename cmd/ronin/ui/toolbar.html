<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ronin</title>
<style>
:root{
  --bg:#14171f; --bg2:#1c2029; --bg3:#262b36; --line:#2e3441; --text:#e8eaf0; --muted:#9aa3b2;
  --accent:#3b82f6; --accent-ink:#fff; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
}
body.BANKING{ --accent:#16a34a; --bg:#0f1a14; --bg2:#13231a; --bg3:#1b3124; --line:#24452f; }
body.TRADING{ --accent:#f59e0b; --accent-ink:#1a1204; }
body.KIDS{ --accent:#ec4899; --accent-ink:#fff; }
body.CALLS{ --accent:#06b6d4; --accent-ink:#04212a; }
.tool{height:32px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px;flex:none;background:var(--bg3)}
.tool:hover{filter:brightness(1.2)}
.tool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.hide{display:none!important}
.vpn{height:24px;padding:0 8px;border-radius:12px;font-size:11px;font-weight:700;display:flex;align-items:center;flex:none}
.vpn.connected{background:#14532d;color:#bbf7d0}.vpn.direct{background:#334155;color:#cbd5e1}.vpn.starting,.vpn.problem{background:#78350f;color:#fde68a}
.ai-out{white-space:pre-wrap;background:var(--bg);padding:14px;border-radius:10px;max-height:52vh;overflow:auto;user-select:text;line-height:1.6}
textarea,input.txt,select.txt{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;user-select:text}
.section{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.section h2{font-size:15px;margin:0 0 8px}
.dlname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.dlst{white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
body.PRIVATE{ --accent:#8b5cf6; --bg:#16131f; --bg2:#1d1929; --bg3:#272236; --line:#352e48; }
/* Day mode */
body.light{ --bg:#eef0f4; --bg2:#ffffff; --bg3:#e3e6ec; --line:#d3d8e1; --text:#151922; --muted:#5a6375; }
body.light.BANKING{ --bg:#e9f5ee; --bg2:#ffffff; --bg3:#d7ecdf; --line:#b5d9c2; }
body.light.PRIVATE{ --bg:#f1eef9; --bg2:#ffffff; --bg3:#e4def3; --line:#cfc5ea; }
body.light #msg.info{background:#dbeafe}body.light #msg.ok{background:#dcfce7}
body.light #msg.warn,body.light #msg.protect{background:#fef3c7}
body.light #msg.danger,body.light #msg.block,body.light #msg.error{background:#fee2e2}
body.light #msg .act{background:#151922;color:#fff}
body.light .vpn.connected{background:#dcfce7;color:#14532d}body.light .vpn.direct{background:#e2e8f0;color:#334155}
body.light .vpn.starting,body.light .vpn.problem{background:#fef3c7;color:#78350f}
body.light .tab .up{color:#15803d}body.light .tab .down{color:#dc2626}
#themeBtn svg{width:18px;height:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bar{background:var(--bg)}
/* tabs */
#tabs{display:flex;align-items:flex-end;gap:2px;height:36px;padding:6px 8px 0;overflow:hidden}
.tab{display:flex;align-items:center;gap:6px;min-width:60px;max-width:220px;flex:1 1 200px;height:30px;
  padding:0 6px 0 10px;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);position:relative}
.tab:hover{background:var(--bg2)}
.tab.active{background:var(--bg2);color:var(--text)}
.tab .up{color:#22c55e;font-weight:600}.tab .down{color:#ef4444;font-weight:600}
.tab .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.tab .x:hover{background:var(--bg3);color:var(--text)}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);border-top-color:var(--accent);animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
#plus{width:28px;height:28px;border-radius:7px;font-size:18px;color:var(--muted);flex:none;margin-bottom:1px}
#plus:hover{background:var(--bg2);color:var(--text)}
#toolsBtn{height:28px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--muted);flex:none;margin:0 0 1px 6px;border:1px solid var(--line, rgba(128,128,128,.35))}
#toolsBtn:hover{background:var(--bg2);color:var(--text)}#toolsBtn.on{background:var(--bg2);color:var(--text);font-weight:600}
/* nav row */
#nav{display:flex;align-items:center;gap:4px;height:46px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text);flex:none}
.ib:hover:not(:disabled){background:var(--bg3)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#addrwrap{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;background:var(--bg);border:1px solid var(--line);min-width:0}
#addrwrap:focus-within{border-color:var(--accent)}
#addrwrap .mic{width:28px;height:28px;margin-right:-8px}
.zoompill{height:22px;padding:0 8px;border-radius:11px;background:var(--bg3);color:var(--text);font-size:11px;font-weight:700;flex:none}
.zoomrow{display:flex;align-items:center;gap:4px;padding:2px 4px}.zoomrow span{flex:1;padding-left:8px}
.zoomrow button{width:40px!important;text-align:center!important;font-size:17px;font-weight:700}
.hist .when{color:var(--muted);font-size:11px;flex:none;width:86px}
.hist .row .btn{width:auto!important;display:inline-block!important;text-align:center!important}
#addrwrap.listening{border-color:#ef4444;box-shadow:0 0 0 2px #ef444455}
#addrwrap.listening .mic svg{stroke:#ef4444}
#lock{width:14px;height:14px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
#lock.secure{stroke:var(--ok)}
#addr{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;user-select:text}
#badge{height:28px;padding:0 10px;border-radius:14px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px;
  letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);flex:none;white-space:nowrap}
#badge svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2}
/* message bar */
#msg{display:none;align-items:center;gap:10px;min-height:34px;padding:6px 12px;font-size:13px;border-bottom:1px solid var(--line)}
#msg.show{display:flex}
#msg .txt{flex:1}
#msg.info{background:#172554}#msg.ok{background:#12301d}#msg.warn,#msg.protect{background:#3a2a0b}#msg.danger,#msg.block,#msg.error{background:#3b1215}
#msg .act{padding:4px 12px;border-radius:6px;background:var(--text);color:#111;font-weight:600}
#msg .close{color:var(--muted);font-size:16px;padding:0 4px}
/* overlay */
#ov{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto}
#ov.show{display:block}
#ov.clear{background:transparent}
/* side panel mode: the same page, shown at the right of the window */
body.panel #bar,body.panel #msg{display:none!important}
body.panel{border-left:1px solid var(--line)}
body.panel #ov{background:var(--bg2)}
body.panel .card{max-width:none;margin:0;border:0;border-radius:0;padding:18px 18px 24px;background:var(--bg2)}
body.panel .card h1{font-size:18px;padding-right:28px}
body.panel .pclose{position:fixed;top:10px;right:10px;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:18px;z-index:5}
body.panel .pclose:hover{background:var(--line);color:var(--text)}
.card{max-width:560px;margin:56px auto;padding:28px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.card h1{margin:0 0 10px;font-size:22px;line-height:1.25}
.card p{margin:8px 0;color:var(--text)}
.card .muted{color:var(--muted)}
.card .host{font-family:Consolas,monospace;background:var(--bg);padding:2px 6px;border-radius:5px;word-break:break-all}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{padding:9px 16px;border-radius:8px;background:var(--bg3);font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.red{background:var(--danger);color:#fff}
.link{color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
.danger-ico{width:44px;height:44px;border-radius:50%;background:var(--danger);display:grid;place-items:center;margin-bottom:14px}
.danger-ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.5}
ul.list{list-style:none;margin:8px 0;padding:0}
ul.list li{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--bg);border-radius:7px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin-top:12px}
.kv b{color:var(--muted);font-weight:500}
.menu{position:fixed;top:84px;right:10px;width:260px;padding:6px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);box-shadow:0 12px 40px #0008}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px}
.menu button:hover{background:var(--bg3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
label.chk{display:flex;gap:8px;align-items:center;margin:10px 0}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
html:has(body.light){background:#eef0f4}html:has(body.light.BANKING){background:#e9f5ee}html:has(body.light.PRIVATE){background:#f1eef9}
</style>
</head>
<body>
<div id="bar">
  <div id="tabs"></div>
  <div id="nav">
    <button class="ib" id="back" title="Back (Alt+Left)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="ib" id="fwd" title="Forward (Alt+Right)"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="ib" id="reload" title="Reload (F5)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    <button class="ib" id="home" title="New Tab page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <div id="addrwrap">
      <svg id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="addr" spellcheck="false" autocomplete="off" placeholder="Search Google or type a web address">
      <button class="zoompill hide" id="zoomPill" title="Page size - click for normal size (Ctrl+0)"></button>
      <button class="ib mic" id="micBtn" title="Speak to search (Hindi or English)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <button class="tool hide" id="dlBtn" title="Download this video"><svg viewBox="0 0 24 24"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"/></svg>Download</button>
    <button class="tool hide" id="gridBtn" title="Show 1, 2 or 4 charts"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg><span>1</span></button>
    <button class="tool hide" id="aiBtn" title="AI: summary, Hindi, questions"><svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>AI</button>
    <span class="vpn hide" id="vpnTag">VPN</span>
    <div id="badge"></div>
    <button class="ib" id="themeBtn" title="Day / Night mode"></button>
    <button class="ib" id="menuBtn" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div id="msg"><span class="txt"></span><span class="acts"></span><button class="close" title="Close">&#x2715;</button></div>
</div>
<div id="ov"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const post = o => window.chrome.webview.postMessage(JSON.stringify(o));
const CONTAINER = "{{CONTAINER}}";
const PANEL = "{{PANEL}}" === "1";
if (PANEL) document.body.classList.add("panel");
let THEME = "{{THEME}}";
document.body.className = CONTAINER + (PANEL ? " panel" : "") + (THEME === "light" ? " light" : "");
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
function applyTheme(t){
  THEME = t; document.body.classList.toggle("light", t === "light");
  const b = document.getElementById("themeBtn");
  if (b) { b.innerHTML = t === "light" ? MOON : SUN; b.title = t === "light" ? "Switch to Night mode" : "Switch to Day mode"; }
}
let S = {tabs: []}, bars = {}, editing = false, ovOpen = false;

const badgeText = {PERSONAL:"Ronin", BANKING:"Ronin Safe Money", TRADING:"Trading", PRIVATE:"Private", KIDS:"Ronin Kids", CALLS:"Video call"};
const shield = '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>';
$("#badge").innerHTML = (CONTAINER === "BANKING" ? shield : "") + '<span></span>';
$("#badge span").textContent = badgeText[CONTAINER] || "Ronin";

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function active(){ return S.tabs.find(t => t.active); }

function reportLayout(){
  if (PANEL) return;
  post({cmd:"layout", h: Math.ceil($("#bar").getBoundingClientRect().height), full: ovOpen});
}
new ResizeObserver(reportLayout).observe($("#bar"));

function renderTabs(){
  const box = $("#tabs"); box.textContent = "";
  for (const t of S.tabs){
    if (t.tool) continue; // Ronin Tools is not a tab: the Tools button opens it
    const d = el("div", "tab" + (t.active ? " active" : ""));
    d.title = t.title + (t.url ? "\n" + t.url : "");
    if (t.loading) d.appendChild(el("span", "spin"));
    const tt = el("span", "t");
    const title = t.title || "New Tab";
    // price titles like "NIFTY 25,360 ▲ +1.2%": green when up, red when down
    const m = title.match(/^(.*?)([\u25B2\u25BC\u2191\u2193])\s*([+\-\u2212]?\s*[\d.,]+\s*%?)(.*)$/);
    if (m) {
      const up = m[2] === "\u25B2" || m[2] === "\u2191";
      tt.appendChild(document.createTextNode(m[1]));
      const c = el("span", up ? "up" : "down", m[2] + " " + m[3].trim());
      tt.appendChild(c);
    } else {
      const m2 = title.match(/^(.*?\s)([+\-\u2212]\d[\d.,]*\s*%)(.*)$/);
      if (m2) {
        tt.appendChild(document.createTextNode(m2[1]));
        tt.appendChild(el("span", m2[2][0] === "+" ? "up" : "down", m2[2]));
      } else tt.textContent = title;
    }
    d.appendChild(tt);
    const x = el("button", "x", "✕"); x.title = "Close tab (Ctrl+W)";
    x.onclick = e => { e.stopPropagation(); post({cmd:"close", id:t.id}); };
    d.appendChild(x);
    d.onmousedown = e => { if (e.button === 1){ e.preventDefault(); post({cmd:"close", id:t.id}); } };
    d.onclick = () => post({cmd:"select", id:t.id});
    box.appendChild(d);
  }
  const p = el("button", "", "+"); p.id = "plus"; p.title = "New tab (Ctrl+T)";
  p.onclick = () => post({cmd:"newtab"}); box.appendChild(p);
  if (CONTAINER !== "BANKING") {
    const a = active(), on = !!(a && a.tool);
    const tb = el("button", on ? "on" : "", "\uD83E\uDDF0 Tools"); tb.id = "toolsBtn";
    tb.title = "Ronin Tools: Data Match, PDF and Photo tools";
    tb.onclick = () => post({cmd:"tools"}); box.appendChild(tb);
  }
}

function renderNav(){
  const a = active();
  $("#dlBtn").classList.toggle("hide", !(a && a.video));
  const g = $("#gridBtn"); g.classList.toggle("hide", CONTAINER !== "TRADING" || S.mini);
  g.querySelector("span").textContent = String(S.grid > 1 ? S.grid : 1);
  $("#aiBtn").classList.toggle("hide", CONTAINER !== "PERSONAL" && CONTAINER !== "PRIVATE");
  const v = $("#vpnTag");
  v.classList.toggle("hide", !S.vpn);
  v.className = "vpn " + (S.vpn || "") + (S.vpn ? "" : " hide");
  if (S.vpn === "connected" && S.vpnSmart && !S.vpnHere) {
    v.className = "vpn direct"; v.textContent = "No VPN";
    v.title = "This is a trusted site, so it opens directly (faster). Unknown and sensitive sites use the VPN.";
  } else {
    v.textContent = S.vpn === "connected" ? "VPN on" : (S.vpn ? "VPN..." : "");
    v.title = S.vpnSmart ? "This site uses the VPN (unknown or sensitive site)." : "Every site in this window uses the VPN.";
  }
  $("#back").disabled = !(a && a.canBack);
  $("#fwd").disabled = !(a && a.canFwd);
  $("#lock").classList.toggle("secure", !!(a && a.secure));
  if (!editing) $("#addr").value = a ? a.url : "";
  renderBar();
  const zp = $("#zoomPill"), z = (active() || {}).zoom || 100;
  zp.textContent = z + "%"; zp.classList.toggle("hide", z === 100);
  const zl = document.querySelector("#ov.show .zoomrow span"); if (zl) zl.textContent = "Page size  " + z + "%";
}

function renderBar(){
  const a = active(), m = $("#msg");
  const b = (a && bars[a.id]) || bars[0];
  if (!b){ m.className = ""; reportLayout(); return; }
  m.className = "show " + b.kind;
  m.querySelector(".txt").textContent = b.text;
  const acts = m.querySelector(".acts"); acts.textContent = "";
  for (const ac of (b.actions || [])){
    const btn = el("button", "act", ac.label);
    btn.onclick = () => { post({cmd: ac.cmd, id: b.tab, url: ac.url || ""}); delete bars[b.tab]; renderBar(); };
    acts.appendChild(btn);
  }
  reportLayout();
}
$("#msg .close").onclick = () => { const a = active(); if (a && bars[a.id]) delete bars[a.id]; else delete bars[0]; renderBar(); };

const addr = $("#addr");
addr.addEventListener("focus", () => { editing = true; setTimeout(() => addr.select(), 0); });
addr.addEventListener("blur", () => { if (voice.on) return; editing = false; renderNav(); });
// ---- speak to search: Windows voice typing writes into the address box;
// when the words stop for a moment Ronin opens them by itself (no Enter needed).
const voice = {on:false, settle:null, stop:null};
function voiceEnd(){
  voice.on = false; clearTimeout(voice.settle); clearTimeout(voice.stop);
  $("#addrwrap").classList.remove("listening"); addr.placeholder = "Search Google or type a web address";
}
function voiceGo(){
  const v = addr.value.trim().replace(/[\s.,!?\u0964]+$/u, "");
  voiceEnd();
  if (v){ post({cmd:"go", text:v}); editing = false; addr.blur(); }
}
function voiceStart(){
  voice.on = true; editing = true; addr.value = ""; addr.focus();
  $("#addrwrap").classList.add("listening"); addr.placeholder = "Speak now - Hindi or English...";
  post({cmd:"voice"});
  clearTimeout(voice.stop); voice.stop = setTimeout(voiceEnd, 25000);
}
addr.addEventListener("input", () => {
  if (!voice.on) return;
  clearTimeout(voice.settle); voice.settle = setTimeout(voiceGo, 1800);
});
$("#zoomPill").onclick = () => post({cmd:"zoom", number:0});
$("#micBtn").onclick = e => { e.preventDefault(); voice.on ? voiceEnd() : voiceStart(); };
$("#micBtn").onmousedown = e => e.preventDefault(); // keep the focus in the address box
if (CONTAINER === "BANKING") $("#micBtn").classList.add("hide"); // Safe Money: nothing leaves the PC
addr.addEventListener("keydown", e => {
  if (e.key === "Enter"){ voiceEnd(); post({cmd:"go", text: addr.value}); editing = false; addr.blur(); }
  if (e.key === "Escape"){ voiceEnd(); editing = false; addr.blur(); }
});
$("#back").onclick = () => post({cmd:"back"});
$("#fwd").onclick = () => post({cmd:"fwd"});
$("#reload").onclick = () => { const a = active(); post({cmd: a && a.loading ? "stop" : "reload"}); };
$("#home").onclick = () => post({cmd:"home"});
$("#menuBtn").onclick = () => showMenu();
$("#dlBtn").onclick = () => post({cmd:"downloadmenu"});
$("#gridBtn").onclick = () => { const n = S.grid === 2 ? 4 : (S.grid === 4 ? 1 : 2); post({cmd:"grid", number:n}); };
$("#aiBtn").onclick = () => post({cmd:"aimenu"});

/* ---------- overlays ---------- */
function openOv(card, clear){
  const ov = $("#ov"); ov.textContent = ""; ov.appendChild(card);
  ov.classList.toggle("clear", !!clear);
  if (PANEL) { const x = el("button", "pclose", "\u2715"); x.title = "Close (Esc)"; x.onclick = closeOv; ov.appendChild(x); }
  ov.classList.add("show"); ovOpen = true; reportLayout();
}

function dlKey(j){ return [j.id, j.state, j.canPause ? 1 : 0, j.vpn ? 1 : 0, j.scan || "", j.error || ""].join("|"); }
function dlState(j){
  if (j.state === "downloading" && j.stalled) return "Waiting...";
  return {preparing:"Getting ready", downloading: (j.percent >= 0 ? Math.round(j.percent) + "%" : "Downloading"), paused:"Paused", needlink:"Link expired", scanning:"Checking for viruses", done:"Saved", failed:"Failed", cancelled:"Cancelled", blocked:"Virus removed"}[j.state] || j.state;
}
function dlInfo(j){
  const parts = [];
  if (j.size) parts.push(j.size);
  if (j.state === "paused") parts.push("paused");
  else if (j.stalled) parts.push(j.note || "nothing is arriving - Ronin keeps trying");
  else { if (j.speed) parts.push(j.speed); if (j.eta) parts.push(j.eta + " left"); if (j.note) parts.push(j.note); }
  return parts.join("  ·  ");
}
function dlPatch(o){
  const c = document.querySelector('#ov.show [data-dl="1"]'); if (!c) return false;
  const lis = c.querySelectorAll("li[data-key]"), jobs = o.jobs || [];
  if (lis.length !== jobs.length) return false;
  for (let i = 0; i < jobs.length; i++) if (lis[i].dataset.key !== dlKey(jobs[i])) return false;
  jobs.forEach((j, i) => {
    const li = lis[i], st = li.querySelector(".dlst"), bar = li.querySelector(".prog i"), info = li.querySelector(".dlinfo");
    if (st) st.textContent = dlState(j);
    if (bar) bar.style.width = Math.max(j.percent, 0) + "%";
    if (info) info.textContent = dlInfo(j);
  });
  return true;
}

function histDraw(list, o, q){
  list.textContent = "";
  if (o.off) { list.appendChild(el("div", "muted", "Ronin is not keeping history.")).style.padding = "6px 10px"; return; }
  if (!(o.list || []).length) { list.appendChild(el("div", "muted", q() ? "Nothing found." : "No pages yet.")).style.padding = "6px 10px"; return; }
  o.list.forEach(h => {
    const r = el("div"); r.style.cssText = "display:flex;align-items:center;gap:4px";
    const w = el("span", "when", h.when);
    const go = el("button", "", h.title || h.url); go.title = h.url; go.style.cssText = "flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    go.onclick = () => post({cmd:"histopen", url: h.url});
    const x = el("button", "", "\u2715"); x.title = "Remove from history"; x.style.cssText = "width:34px;flex:none;text-align:center;color:var(--muted)";
    x.onclick = () => post({cmd:"histremove", url: h.url, text: q()});
    r.append(w, go, x); list.appendChild(r);
  });
}

  historyList(o){ const l = document.querySelector('#ov.show [data-hist="1"]'); const i = document.querySelector("#ov.show .hist input");
    if (l) histDraw(l, o, () => i ? i.value : ""); },
  state(s){ S = s; renderTabs(); renderNav(); },

    const f = overlays[o.kind]; if (f) { const c = f(o); openOv(c, c.dataset && c.dataset.clear === "1"); }
  },
  bar(b){ if (b.text) bars[b.tab || 0] = b; else delete bars[b.tab || 0]; renderBar(); },
  focusAddress(){ if (!ovOpen){ addr.focus(); } },
  closeOverlay(){ closeOv(); },
  tabSearch(){ tabSearch(); },
  theme(t){ applyTheme(t); }
};
