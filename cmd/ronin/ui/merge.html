<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>डेटा मिलाओ</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#111;--mut:#555;--line:#d6dbe6;--ok:#16a34a;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#15171c;--card:#20232b;--fg:#eee;--mut:#aab;--line:#343846}}
body.dark{--bg:#15171c;--card:#20232b;--fg:#eee;--mut:#aab;--line:#343846}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px "Segoe UI","Nirmala UI","Noto Sans Devanagari",sans-serif}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}h1{font-size:26px;margin:0 0 6px}
p{color:var(--mut);margin:6px 0 14px;line-height:1.45}
.big{display:block;width:100%;min-height:64px;margin:12px 0;border:0;border-radius:16px;font-family:inherit;font-weight:600;font-size:20px;cursor:pointer;color:#fff;background:#2563eb}
.big.go{background:var(--ok)}.big:disabled{opacity:.45;cursor:default}
.small{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer}
ul{list-style:none;padding:0;margin:0}li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
li b{display:block;word-break:break-all}li span{color:var(--mut);font-size:15px}li.err span{color:var(--bad)}
#msg{font-size:17px;color:var(--fg);background:var(--card);border-left:5px solid var(--ok);border-radius:10px;padding:12px 14px;display:none;white-space:pre-line}
#msg.err{border-color:var(--bad)}
</style></head><body>
<main>
<h1>🔀 डेटा मिलाओ</h1>
<p>Prerna, UDISE+ या किसी भी portal की बच्चों की Excel files एक साथ चुनें (कई files एक बार में चुन सकते हैं)। हर बच्चा एक पंक्ति में आएगा, दोनों portal की पूरी जानकारी के साथ। जहाँ अंतर होगा वह रंग और कारण के साथ दिखेगा।<br>🔒 सब कुछ इसी device पर होता है, कोई डेटा internet पर नहीं जाता।</p>
<input id="pick" type="file" multiple accept=".xlsx,.xlsm,.csv,.xls,.htm,.html,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>
<button class="big" id="choose">📂 Files चुनें</button>
<ul id="list"></ul>
<button class="small" id="clear" hidden>🗑 सब हटाओ</button>
<button class="big go" id="go" disabled>🔀 मिलाओ और Excel + PDF बनाओ</button>
<div id="msg"></div>
</main>
<script nonce="{{NONCE}}">{{MERGEJS}}</script>
<script nonce="{{NONCE}}">
(function () {
  const KEY = '{{KEY}}';
  if ('{{DARK}}' === '1') document.body.classList.add('dark');
  const files = [];
  const $ = id => document.getElementById(id);
  let result = null;
  window.__roninMerge = { result: () => JSON.stringify(result) };
  function show(text, bad) { const m = $('msg'); m.textContent = text; m.className = bad ? 'err' : ''; m.style.display = text ? 'block' : 'none'; }
  function draw() {
    const ul = $('list');
    ul.innerHTML = '';
    files.forEach(f => {
      const li = document.createElement('li');
      if (f.error) li.className = 'err';
      const b = document.createElement('b'); b.textContent = f.name;
      const s = document.createElement('span');
      s.textContent = f.error ? '⚠ ' + f.error : f.read ? '✔ ' + f.read.tables.reduce((a, t) => a + t.rows.length, 0) + ' पंक्तियाँ' + (f.read.site ? ' · ' + f.read.site : '') : 'पढ़ रहा हूँ...';
      li.append(b, s); ul.append(li);
    });
    const ok = files.filter(f => f.read);
    $('go').disabled = !ok.length || files.some(f => !f.read && !f.error);
    $('clear').hidden = !files.length;
    $('choose').textContent = files.length ? '📂 और files जोड़ें' : '📂 Files चुनें';
  }
  $('choose').onclick = () => $('pick').click();
  $('clear').onclick = () => { files.length = 0; result = null; show(''); draw(); };
  $('pick').onchange = async e => {
    const chosen = Array.from(e.target.files || []);
    e.target.value = '';
    show('');
    for (const file of chosen) {
      if (files.some(f => f.name === file.name && f.size === file.size)) continue;
      const f = { name: file.name, size: file.size };
      files.push(f); draw();
      try { f.read = await RoninMerge.readFile(file.name, await file.arrayBuffer()); } catch (err) { f.error = err.message || String(err); }
      draw();
    }
  };
  $('go').onclick = () => {
    try {
      result = RoninMerge.merge(files.filter(f => f.read).map(f => f.read));
    } catch (err) { show('⚠ मिलान नहीं हो सका: ' + (err.message || err), true); return; }
    const lines = result.info.map(x => x[0] + ': ' + x[1]).join('\n');
    show((result.sources.length < 2 ? '⚠ अभी सब files एक ही portal की लगती हैं। दूसरे portal की file भी जोड़ें तो अंतर दिखेगा।\n\n' : '') + lines + '\n\n📊 Excel + PDF बन रही है... (Downloads में save होगी)');
    if (KEY && KEY.indexOf('{{') < 0) location.href = 'https://ronin.data/merge?k=' + KEY;
  };
  draw();
})();
</script>
</body></html>
